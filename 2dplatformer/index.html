<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D Platformer Game</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #222;
            font-family: Arial, sans-serif;
        }
        
        #game-container {
            position: relative;
        }
        
        canvas {
            border: 2px solid #444;
            background-color: #87CEEB;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
        }
        
        #score-display {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            font-size: 20px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }
        
        #game-title {
            position: absolute;
            top: -50px;
            width: 100%;
            text-align: center;
            color: #FFD700;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }
        
        #controls {
            position: absolute;
            bottom: -40px;
            width: 100%;
            text-align: center;
            color: white;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="game-title">2D Platformer Game</div>
        <canvas id="gameCanvas" width="800" height="400"></canvas>
        <div id="score-display">Coins: 0</div>
        <div id="controls">Controls: Arrow Keys to Move, Space to Jump</div>
    </div>

    <script src="game.js"></script>
</body>
</html>
